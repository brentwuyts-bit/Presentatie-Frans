<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mots mêlés – le rebranding</title>
<style>
:root{--bg:#f4f1ea;--fg:#16181d;--muted:#5b5f66;--card:#ffffff;--line:#ddd8cc;--acc:#ff5a1f;--def:#16181d;--deffg:#f4f1ea;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#f4f1ea;--muted:#aaa69c;--card:#23262e;--line:#383c46;--def:#f4f1ea;--deffg:#16181d;--ok:#5fcf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
main{max-width:1100px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;margin:0 0 6px}
h1 span{color:var(--acc)}
.sub{margin:0 0 14px;color:var(--muted);font-size:17px}
.scr{display:none}.scr.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px}
.pill.live{border-color:var(--ok);color:var(--ok)}
input{font:inherit;font-size:18px;font-weight:600;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;max-width:320px}
button.ctl{font:inherit;font-weight:700;font-size:18px;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--card);color:var(--fg);border:1px solid var(--line)}
button.main{background:var(--acc);color:#16181d;border-color:var(--acc)}
.home{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.play{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
#grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;flex:1 1 340px;max-width:600px;user-select:none;-webkit-user-select:none;touch-action:none}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:clamp(14px,4vw,22px);border-radius:6px}
.cell.sel{background:var(--def);color:var(--deffg)}
.cell.fnd{background:var(--acc);color:#16181d;border-color:var(--acc)}
.side{flex:1 1 240px}.side h2{font-size:20px;margin:0 0 10px}
#words{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
#words li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700}
#words li.found{text-decoration:line-through;opacity:.5;border-color:var(--ok)}
#msg{margin:14px 0 0;font-size:20px;font-weight:700;min-height:30px}
.dc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.dc b{font-size:20px}.dc p{margin:4px 0 0;font-size:17px}
.hbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
.hbar h1{margin:0;font-size:clamp(28px,4vw,52px)}
.codebox{background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:10px 18px;display:flex;gap:16px;align-items:center}
.codebox .big{font-size:clamp(28px,4vw,52px);font-weight:800;letter-spacing:.12em}
.codebox small{display:block;color:var(--muted);font-size:14px;word-break:break-all;max-width:260px}
#qr{background:#fff;padding:6px;border-radius:8px;line-height:0}
.hwrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:20px}
#slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.slot{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 20px;min-height:110px;cursor:pointer}
.slot .k{font-size:clamp(22px,3vw,40px);font-weight:800;letter-spacing:.06em;color:var(--muted)}
.slot .d{font-size:clamp(16px,1.9vw,26px);margin-top:6px;display:none}
.slot .by{font-size:clamp(14px,1.5vw,20px);color:var(--ok);font-weight:700;margin-top:6px;display:none}
.slot.on{border:2px solid var(--acc);border-left-width:10px}
.slot.on .k{color:var(--fg);letter-spacing:0;font-size:clamp(26px,3.6vw,48px)}
.slot.on .d,.slot.on .by{display:block}
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.board h2{margin:0 0 10px;font-size:clamp(20px,2.2vw,30px)}
.board ol{margin:0;padding-left:28px;font-size:clamp(18px,2vw,28px);font-weight:700}
.board li{margin-bottom:6px}
@media (max-width:760px){.hwrap{grid-template-columns:1fr}#slots{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<main>

<section id="home" class="scr on">
<h1>Mots <span>mêlés</span></h1>
<p class="sub">Le rebranding : retrouvez les mots cachés dans la grille.</p>
<div class="home">
<input id="code" maxlength="4" placeholder="Code de la classe" autocomplete="off" style="text-transform:uppercase">
<input id="nm" maxlength="20" placeholder="Votre prénom" autocomplete="off">
<button class="ctl main" id="join" type="button">Jouer</button>
<p class="sub" id="homeerr" style="color:#c0392b;margin:0"></p>
<hr style="width:100%;border:0;border-top:1px solid var(--line)">
<button class="ctl" id="tohost" type="button">Je suis présentateur</button>
</div>
</section>

<section id="player" class="scr">
<h1>Mots <span>mêlés</span></h1>
<p class="sub">Glissez le doigt sur un mot (→ ↓ ↘ ↗ ←) ou touchez sa première, puis sa dernière lettre.</p>
<div class="bar"><span class="pill" id="fd">Mots : 0/10</span><span class="pill" id="st">Connexion…</span></div>
<div class="play">
<div id="grid"></div>
<div class="side"><h2>Mots à trouver</h2><ul id="words"></ul><div id="defs"></div></div>
</div>
<div id="msg" aria-live="polite"></div>
</section>

<section id="host" class="scr">
<div class="hbar">
<h1>Mots <span>mêlés</span></h1>
<div class="codebox"><div><div class="big" id="hcode">····</div><small id="hurl"></small></div><div id="qr"></div></div>
<span class="pill" id="hst">Connexion…</span>
</div>
<div class="hwrap"><div id="slots"></div><div class="board"><h2>Classement</h2><ol id="rank"></ol></div></div>
</section>

</main>
<script>
/* >>> Plak hier de URL van je Firebase Realtime Database (zie README) <<< */
const FIREBASE_URL="https://presentatie-frans-36eeb-default-rtdb.europe-west1.firebasedatabase.app";
let db=null;
try{if(window.firebase&&!FIREBASE_URL.startsWith("PLAK")){firebase.initializeApp({databaseURL:FIREBASE_URL});db=firebase.database()}}catch(e){db=null}
const W=[
["rebranding","REBRANDING","Changer l’image et l’identité d’une marque (nom, logo, couleurs, message)."],
["marque","MARQUE","Nom et univers qui distinguent un produit ou une entreprise."],
["logo","LOGO","Symbole graphique qui représente une marque."],
["slogan","SLOGAN","Phrase courte et facile à retenir qui accompagne la marque."],
["notoriété","NOTORIETE","Le fait d’être connu par beaucoup de gens."],
["cible","CIBLE","Le public cible : les personnes que l’on veut atteindre."],
["lancement","LANCEMENT","Moment où un produit arrive sur le marché."],
["concurrence","CONCURRENCE","Les autres entreprises qui vendent des produits similaires."],
["identité","IDENTITE","Ensemble des éléments (couleurs, formes, valeurs) qui définissent une marque."],
["image","IMAGE","L’impression que le public a d’une marque."]
];
const KEYS=W.map(w=>w[1]);
const N=12,DIRS=[[0,1],[1,0],[1,1],[-1,1],[0,-1]],$=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id))}

/* ---------- grille identique pour tout le monde (graine = code) ---------- */
let seed=1;
function R(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const rnd=n=>Math.floor(R()*n);
function gen(){
const a=Array(N*N).fill("");
for(const [,k] of [...W].sort((x,y)=>y[1].length-x[1].length)){
let ok=false;
for(let t=0;t<500&&!ok;t++){
const d=DIRS[rnd(DIRS.length)],r=rnd(N),c=rnd(N),L=k.length,er=r+d[0]*(L-1),ec=c+d[1]*(L-1);
if(er<0||er>=N||ec<0||ec>=N)continue;
let fit=true;
for(let i=0;i<L;i++){const v=a[(r+d[0]*i)*N+c+d[1]*i];if(v&&v!==k[i]){fit=false;break}}
if(!fit)continue;
for(let i=0;i<L;i++)a[(r+d[0]*i)*N+c+d[1]*i]=k[i];
ok=true}
if(!ok)return null}
const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
return a.map(v=>v||A[rnd(26)])}
function seedFrom(code){let h=7;for(const ch of code)h=(h*31+ch.charCodeAt(0))|0;return h}

/* ---------- joueur ---------- */
let g=null,cells=[],found={},nameV="",roomCode="",pid="",pref=null;
function buildPlayer(code){
seed=seedFrom(code);do{g=gen()}while(!g);
const gr=$("grid");gr.textContent="";cells=[];
g.forEach((ch,i)=>{const d=document.createElement("div");d.className="cell";d.dataset.i=i;d.textContent=ch;gr.appendChild(d);cells.push(d)});
$("words").textContent="";
W.forEach(([d,k])=>{const li=document.createElement("li");li.id="w-"+k;li.textContent=d;$("words").appendChild(li)})}
function line(a,b){
const r1=Math.floor(a/N),c1=a%N,r2=Math.floor(b/N),c2=b%N,dr=r2-r1,dc=c2-c1;
if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return null;
const n=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc),o=[];
for(let k=0;k<n;k++)o.push((r1+sr*k)*N+c1+sc*k);return o}
function snap(a,b){
const r1=Math.floor(a/N),c1=a%N;let dr=Math.floor(b/N)-r1,dc=b%N-c1;
const ar=Math.abs(dr),ac=Math.abs(dc);let len;
if(ar>=2*ac){dc=0;len=ar}else if(ac>=2*ar){dr=0;len=ac}else len=Math.max(ar,ac);
const sr=Math.sign(dr),sc=Math.sign(dc);
while(len>0){const r=r1+sr*len,c=c1+sc*len;if(r>=0&&r<N&&c>=0&&c<N)break;len--}
return (r1+sr*len)*N+c1+sc*len}
function paint(a,b){cells.forEach(c=>c.classList.remove("sel"));if(a==null)return;(line(a,b)||[a]).forEach(i=>cells[i].classList.add("sel"))}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest?el.closest(".cell"):null;return c?+c.dataset.i:null}
let start=null,end=null,drag=false,tap=null;
const gr=$("grid");
gr.addEventListener("pointerdown",e=>{
const i=cellAt(e);if(i==null)return;e.preventDefault();
try{gr.setPointerCapture(e.pointerId)}catch(x){}
if(tap!==null){const a=tap;tap=null;paint(null);attempt(a,i);return}
start=i;end=i;drag=true;paint(start,end)});
gr.addEventListener("pointermove",e=>{if(!drag)return;const j=cellAt(e);if(j==null)return;end=snap(start,j);paint(start,end)});
gr.addEventListener("pointerup",()=>{
if(!drag)return;drag=false;
if(end===start){tap=start;paint(start,start)}else{const a=start,b=end;paint(null);attempt(a,b)}});
gr.addEventListener("pointercancel",()=>{drag=false;paint(null)});
function attempt(a,b){
const l=a===b?null:line(a,b);let w=null;
if(l){let s="";l.forEach(i=>s+=g[i]);const rv=[...s].reverse().join("");w=W.find(([,k])=>!found[k]&&(k===s||k===rv))}
if(w){
found[w[1]]=Date.now();l.forEach(i=>cells[i].classList.add("fnd"));
$("w-"+w[1]).classList.add("found");
const n=Object.keys(found).length;$("fd").textContent="Mots : "+n+"/10";
const dc=document.createElement("div");dc.className="dc";
const bb=document.createElement("b");bb.textContent=w[0];const pp=document.createElement("p");pp.textContent=w[2];
dc.append(bb,pp);$("defs").prepend(dc);
$("msg").textContent=n===W.length?"Bravo ! Vous avez tout trouvé !":"Bien joué : « "+w[0]+" » !";
push(w[1])}
else $("msg").textContent="Ce n’est pas un mot de la liste. Essayez encore !"}
function setSt(t,ok){const s=$("st");s.textContent=t;s.className="pill"+(ok?" live":"")}
function push(k){if(pref&&k)pref.child("found/"+k).set(firebase.database.ServerValue.TIMESTAMP)}
function startPlayer(code,name){
roomCode=code;nameV=name||"Joueur";found={};
db.ref("rooms/"+code+"/host").once("value").then(sn=>{
if(!sn.exists()){$("homeerr").textContent="Code introuvable. Vérifiez le code affiché au tableau.";return}
buildPlayer(code);$("fd").textContent="Mots : 0/10";$("defs").textContent="";$("msg").textContent="";
show("player");setSt("Connexion…",false);
pid=Math.random().toString(36).slice(2,10);
pref=db.ref("rooms/"+code+"/players/"+pid);
db.ref(".info/connected").on("value",c=>{
const on=c.val()===true;setSt(on?"Connecté à la classe":"Reconnexion…",on);
if(on){pref.onDisconnect().update({online:false});pref.update({name:nameV,online:true})}})
}).catch(()=>{$("homeerr").textContent="Connexion impossible. Vérifiez Internet."})}
$("join").addEventListener("click",()=>{
const c=$("code").value.trim().toUpperCase();
if(!db){$("homeerr").textContent="Firebase n’est pas configuré (voir README).";return}
if(c.length!==4){$("homeerr").textContent="Entrez le code à 4 lettres affiché au tableau.";return}
$("homeerr").textContent="";startPlayer(c,$("nm").value.trim().slice(0,20))});

/* ---------- présentateur ---------- */
let players=new Map(),manual={};
const slots=$("slots");
W.forEach(([d,k,def])=>{
const s=document.createElement("div");s.className="slot";s.id="s-"+k;
s.innerHTML='<div class="k"></div><div class="d"></div><div class="by"></div>';
s.querySelector(".d").textContent=def;
s.addEventListener("click",()=>{manual[k]=!manual[k];renderHost()});
slots.appendChild(s)});
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c}
function renderHost(){
const ps=[...players.values()];
const online=ps.filter(p=>p.online).length;
$("hst").textContent=online+" joueur"+(online>1?"s":"")+" en ligne";
$("hst").className="pill"+(online?" live":"");
for(const [,k] of W){
let best=null,cnt=0;
for(const p of ps){const t=p.found[k];if(t){cnt++;if(!best||t<best.t)best={t,n:p.name}}}
const sh=!!best||!!manual[k],s=$("s-"+k);
s.classList.toggle("on",sh);
s.querySelector(".k").textContent=sh?W.find(w=>w[1]===k)[0]:"_ ".repeat(k.length).trim();
s.querySelector(".by").textContent=best?"Trouvé par "+best.n+(cnt>1?" (+"+(cnt-1)+")":""):""}
const top=ps.map(p=>{const v=Object.values(p.found);return{name:p.name,n:v.length,last:Math.max(0,...v)}})
.filter(p=>p.n>0).sort((a,b)=>b.n-a.n||a.last-b.last).slice(0,5);
const ol=$("rank");ol.textContent="";
top.forEach(p=>{const li=document.createElement("li");li.textContent=p.name+" · "+p.n+"/10";ol.appendChild(li)})}
function startHost(){
show("host");
if(!db){$("hst").textContent="Firebase n’est pas configuré (voir README)";return}
const code=newCode(),url=location.origin+location.pathname;
$("hcode").textContent=code;$("hurl").textContent=url+"?room="+code;
try{if(window.qrcode){const qr=qrcode(0,"M");qr.addData(url+"?room="+code);qr.make();$("qr").innerHTML=qr.createSvgTag(4,0)}}catch(x){}
db.ref("rooms/"+code+"/host").set(firebase.database.ServerValue.TIMESTAMP).catch(e=>{$("hst").textContent="Erreur Firebase : "+e.code});
db.ref("rooms/"+code+"/players").on("value",sn=>{
const v=sn.val()||{};players=new Map();
for(const [id,p] of Object.entries(v)){
if(!p||typeof p!=="object")continue;
const f={};if(p.found&&typeof p.found==="object")for(const k of KEYS)if(typeof p.found[k]==="number")f[k]=p.found[k];
players.set(id,{name:String(p.name||"Joueur").slice(0,20),found:f,online:p.online===true})}
renderHost()},e=>{$("hst").textContent="Erreur Firebase : "+e.code})}
$("tohost").addEventListener("click",startHost);
const q=new URLSearchParams(location.search).get("room");
if(q)$("code").value=q.toUpperCase().slice(0,4);
</script>
</body>
</html>
